# ─────────────────────────────────────────────────────────────────────────
# nginx server block — newsfeed.wetreadwell.com -> 127.0.0.1:8890
#
# Install on the VPS:
#   cp deploy/nginx-newsfeed.conf /etc/nginx/sites-available/newsfeed.wetreadwell.com
#   ln -s /etc/nginx/sites-available/newsfeed.wetreadwell.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Then provision TLS with certbot (see deploy/README.md). certbot --nginx will
# rewrite/duplicate this block to add the 443 listener + managed cert lines and a
# redirect; the HTTP block below is the starting point it edits.
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name newsfeed.wetreadwell.com;

    # Allow the ACME http-01 challenge through before/independent of the proxy.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Generous body size for any future uploads / large API payloads.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / keep-alive friendliness (harmless for plain HTTP).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    access_log /var/log/nginx/newsfeed.access.log;
    error_log  /var/log/nginx/newsfeed.error.log;
}
