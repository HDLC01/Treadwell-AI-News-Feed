name: CodeQL

# Static analysis (SAST) for the Python backend AND the TypeScript SPA. Runs on
# every PR + pushes to main, plus a weekly scan to catch newly-published query
# patterns. Findings surface under the repo's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 2'   # Tuesdays 03:27 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
