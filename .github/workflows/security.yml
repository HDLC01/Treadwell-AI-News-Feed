name: Security

# Dependency CVE scanning for both halves of the app. Runs on every PR + pushes
# to main, plus a weekly scan so newly-disclosed CVEs in pinned deps surface even
# without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * 2'   # Tuesdays 03:41 UTC

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  npm-audit:
    name: npm-audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
