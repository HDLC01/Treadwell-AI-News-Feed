# connector.wetreadwell.com -> 127.0.0.1:8894 (Treadwell AI News Feed connector).
# certbot --nginx adds the listen 443 + ssl_certificate lines and the HTTP->HTTPS
# redirect. MCP Streamable HTTP uses SSE-style streamed responses, so buffering is
# OFF and timeouts are long.
server {
    listen 80;
    listen [::]:80;
    server_name connector.wetreadwell.com;

    # Keep request bodies small; this is a JSON-RPC endpoint, not an upload surface.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8894;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Stream MCP/SSE responses straight through.
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  on;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
    }
}
