# connector.wetreadwell.com -> 127.0.0.1:8894 (Treadwell AI News Feed connector).
# certbot --nginx adds the listen 443 + ssl_certificate lines and the HTTP->HTTPS
# redirect. MCP Streamable HTTP uses SSE-style streamed responses, so buffering is
# OFF and timeouts are long.
#
# The directives below the comment live at http scope (sites-enabled/* is included
# inside http{} on Debian/Ubuntu nginx), so the zones + log format are valid here.

# Rate / connection limits — this is a 1–2 person tool, so keep it tight. Blunts
# brute-forcing the URL secret and feed scraping.
limit_req_zone  $binary_remote_addr zone=connector_rl:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=connector_cc:10m;

# Access-log format that OMITS the request URI — the URL path carries the only
# auth secret, so it must never be written to disk.
log_format connector_nouri '$remote_addr - [$time_local] '
                           '"$request_method $host" $status $body_bytes_sent '
                           '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name connector.wetreadwell.com;

    # DNS-rebinding / wrong-Host guard at the edge (the MCP layer doesn't check
    # Host when bound to 0.0.0.0): reject anything not addressed to us.
    if ($host !~* ^connector\.wetreadwell\.com$) { return 421; }

    # Keep request bodies small; this is a JSON-RPC endpoint, not an upload surface.
    client_max_body_size 2m;

    access_log /var/log/nginx/connector.access.log connector_nouri;
    error_log  /var/log/nginx/connector.error.log;

    location / {
        limit_req  zone=connector_rl burst=10 nodelay;
        limit_conn connector_cc 10;

        proxy_pass http://127.0.0.1:8894;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Stream MCP/SSE responses straight through.
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  on;
        # Generous, but no longer an hour — a stuck stream can't hold a slot all day.
        proxy_read_timeout         300s;
        proxy_send_timeout         300s;
    }
}
