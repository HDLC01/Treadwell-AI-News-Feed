[project]
name = "treadwell-newsfeed-mcp"
version = "0.1.0"
description = "MCP server over the Treadwell AI News Feed: top picks, summaries, Dropbox cross-reference, and grounded outreach drafts (read-only)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
newsfeed-mcp = "newsfeed_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsfeed_mcp"]
